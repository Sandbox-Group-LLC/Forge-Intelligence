name: CI

# Merge gate for code quality. Mirrors the intent of CI-AND-PR-CHECKS.md.
#
# Trigger scope is load-bearing: pull_request on [main, development, features] is
# the gate (one run per PR commit); push on [main] ONLY is the post-merge audit.
# `features` is the production-maintenance lane (ships via features -> main while
# development is tied up with the server.js decomposition). NEVER add a push
# trigger for development, features, or feature branches — a "-> main" PR would
# then fire both pull_request AND push for the same commit, producing two
# check-runs with the same name. The branch ruleset matches required checks by
# name, so a duplicated name is ambiguous and parks the check as "expected"
# forever (the duplicate-check deadlock). See CI-AND-PR-CHECKS.md.
on:
  pull_request:
    branches: [main, development, features]
  push:
    branches: [main]

# NOTE: cancel-in-progress is intentionally FALSE. This workflow is the required
# merge gate ("Typecheck & Test" is a required status check on PRs into main). A
# cancelled run reports the required context as cancelled — which is NOT success —
# so cancelling an in-flight run leaves the rollup PR BLOCKED until a fresh run for
# the latest SHA settles clean. Bursts of commits on development (e.g. the nightly
# docs-log automation pushing straight to the branch) used to guillotine the gate
# run and park the PR as "stuck". A few redundant ~45s runs are cheaper than a
# wedged merge gate. cancel-in-progress belongs on throwaway workflows (see
# brain-refresh.yml), not on a required check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # This job's `name` IS the required-status-check context. If you rename it,
    # update the branch ruleset's required-check name to match or merges block.
    name: Typecheck & Test
    runs-on: ubuntu-latest
    # Bound a genuinely wedged run (vitest open handle, npm registry stall). Normal
    # run is ~45s; without this a hung run sits at GitHub's 6h default and reads as
    # "stuck". Fail fast instead.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Backend syntax check (server.js monolith)
        run: node --check server.js
      - name: Lint (no-undef) — catches missed imports from extractions
        run: npm run lint
      - name: Typecheck (React app)
        run: npm run typecheck
      - name: Unit tests (route-inventory guard + future units)
        run: npm test

  # TODO (Tier 2): add a `DB Integration` job — postgres:16 service container +
  # migrations/*.sql + integration tests — to reach parity with SYSOI's stack.
  # Blocked on Forge having a schema source (no migrations/ dir today).
