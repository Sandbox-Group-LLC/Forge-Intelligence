<!doctype html>
<html><head><meta charset="utf-8"/>
<title>Returning-user card</title>
<style>
  html,body{margin:0;height:100%;font-family:Inter,sans-serif;color:#F8FAFC;}
  body{
    background:
      radial-gradient(circle at top left, rgba(53,99,255,0.22), transparent 55%),
      radial-gradient(circle at bottom right, rgba(20,184,166,0.12), transparent 55%),
      #0B0F1A;
    padding:40px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
  }
  .card{
    display:flex;align-items:center;gap:14px;padding:16px 20px;
    background:rgba(53,99,255,.08);border:1px solid rgba(53,99,255,.22);border-radius:12px;
    width:520px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#14B8A6;box-shadow:0 0 8px rgba(20,184,166,.6);flex-shrink:0;animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .info{flex:1;min-width:0;}
  .domain{font:600 15px/1.2 Inter;color:#F8FAFC;}
  .meta{font:400 12px/1.4 Inter;color:#64748B;margin-top:2px;}
  .resume{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:#3563FF;border:none;border-radius:8px;color:#fff;font:500 13px/1 Inter;cursor:pointer;}
  .new{padding:9px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);border-radius:8px;color:rgba(255,255,255,.55);font:500 13px/1 Inter;cursor:pointer;}
  .note{font:400 12px/1.5 Inter;color:#64748B;max-width:520px;text-align:center;}
  .note b{color:#94A3B8;}
</style></head><body>
  <div class="card">
    <div class="dot"></div>
    <div class="info">
      <div class="domain">Sandbox-XM</div>
      <div class="meta">Brain saved · 22h 14m remaining</div>
    </div>
    <button class="resume">Resume Brain
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    <button class="new">New</button>
  </div>
  <p class="note"><b>Drops in where the scan form sits</b> when the returning visitor's domain has a saved brain (24h TTL on the no-account cookie). Teal pulse dot signals "brain alive."</p>
</body></html>
