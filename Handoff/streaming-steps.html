<!doctype html>
<html><head><meta charset="utf-8"/>
<title>Streaming-step list</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:#EDF1FF;font-family:Inter,sans-serif;}
  .wrap{padding:40px;max-width:640px;margin:0 auto;}
  .card{background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(53,99,255,.07),0 4px 16px rgba(53,99,255,.08);padding:28px;}
  .h{font:600 11px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:#3563FF;margin-bottom:8px;}
  h2{font:700 22px/1.3 Inter;letter-spacing:-.02em;color:#0F172A;margin:0 0 18px;}
  .steps{display:flex;flex-direction:column;gap:4px;margin-top:10px;}
  .step{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(53,99,255,.06);}
  .step:last-child{border-bottom:none;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .step.done .dot{background:#0EA572;}
  .step.running .dot{background:#14B8A6;box-shadow:0 0 8px rgba(20,184,166,.6);animation:pulse 1.5s ease-in-out infinite;}
  .step.pending .dot{background:#CBD5E1;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .label{flex:1;font:500 14px/1 Inter;}
  .step.done .label{color:#1E293B;}
  .step.running .label{color:#0F172A;font-weight:600;}
  .step.pending .label{color:#94A3B8;}
  .time{font:600 11px/1 Inter;letter-spacing:.04em;text-transform:uppercase;}
  .step.done .time{color:#0EA572;}
  .step.running .time{color:#3563FF;}
  .step.pending .time{color:#CBD5E1;}
</style></head><body><div class="wrap">
  <div class="card">
    <div class="h">Stage 1 · Context Hub</div>
    <h2>Running analysis on sandbox-xm.com</h2>
    <div class="steps">
      <div class="step done"><span class="dot"></span><span class="label">Crawling sitemap</span><span class="time">Done · 4.2s</span></div>
      <div class="step done"><span class="dot"></span><span class="label">Extracting markdown (Jina Reader)</span><span class="time">Done · 18.7s</span></div>
      <div class="step running"><span class="dot"></span><span class="label">Building voice profile</span><span class="time">Running…</span></div>
      <div class="step pending"><span class="dot"></span><span class="label">Identifying personas</span><span class="time">Queued</span></div>
      <div class="step pending"><span class="dot"></span><span class="label">Mapping competitive gaps</span><span class="time">Queued</span></div>
    </div>
  </div>
</div></body></html>
