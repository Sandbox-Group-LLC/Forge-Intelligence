<!doctype html>
<html><head><meta charset="utf-8"/>
<title>Sidebar — Brain / Pipeline / Settings</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:#EDF1FF;font-family:Inter,sans-serif;height:100%;}
  .stage{display:flex;height:100vh;}
  .sidebar{
    width:240px;min-width:240px;height:100%;
    background:#FFFFFF;
    box-shadow:2px 0 16px rgba(53,99,255,.08), 1px 0 0 rgba(53,99,255,.06);
    display:flex;flex-direction:column;
  }
  .sidebar-header{padding:0 20px;height:64px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #E2E8F0;}
  .sidebar-header svg{color:#3563FF;}
  .sidebar-logo-text{font-size:16px;font-weight:600;letter-spacing:-.01em;color:#1E293B;}
  .sidebar-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
  .nav-group-label{font:600 10px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:#94A3B8;padding:12px 16px 6px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 16px;
    background:transparent;border:none;border-left:2px solid transparent;margin-left:-2px;
    border-radius:0 6px 6px 0;color:#475569;font:500 14px/1 Inter;text-align:left;opacity:.6;
    transition:all 150ms ease;cursor:pointer;
  }
  .nav-item:hover{background:#EDF1FF;color:#1E293B;opacity:1;}
  .nav-item.active{color:#3563FF;opacity:1;border-left-color:#3563FF;}
  .nav-icon{display:flex;width:20px;height:20px;align-items:center;justify-content:center;flex-shrink:0;}
  .nav-label{flex:1;}
  .nav-badge{width:8px;height:8px;border-radius:50%;background:#0EA572;box-shadow:0 0 8px #0EA572;animation:nav-pulse 1.5s ease-in-out infinite;}
  @keyframes nav-pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .sidebar-footer{
    padding:14px 18px;border-top:1px solid rgba(53,99,255,.08);
    display:flex;align-items:center;gap:8px;font:500 12px/1 Inter;color:#94A3B8;
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:#0EA572;box-shadow:0 0 6px #0EA572;}
  .footer-label{flex:1;}
  .footer-value{color:#475569;font-weight:600;}
  /* Stage decoration */
  .deco{flex:1;padding:24px;background:#EDF1FF;display:flex;align-items:flex-end;justify-content:flex-start;}
  .ann{font:500 11px/1.5 Inter;color:#94A3B8;background:#fff;padding:8px 12px;border-radius:6px;box-shadow:0 0 0 1px rgba(53,99,255,.07),0 4px 16px rgba(53,99,255,.08);max-width:300px;}
  .ann b{color:#1E293B;}
</style></head><body><div class="stage">
  <aside class="sidebar">
    <div class="sidebar-header">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 12 12 22 2 12"/></svg>
      <span class="sidebar-logo-text">Forge</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group-label">Brain</div>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg></span><span class="nav-label">New Analysis</span></button>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span><span class="nav-label">Active Run</span><span class="nav-badge"></span></button>
      <button class="nav-item active"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></span><span class="nav-label">Brand Profile</span></button>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></span><span class="nav-label">Strategy</span></button>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span><span class="nav-label">Brain History</span></button>

      <div class="nav-group-label">Pipeline</div>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></span><span class="nav-label">GEO Strategist</span></button>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span><span class="nav-label">Authenticity</span></button>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span><span class="nav-label">Content Generator</span></button>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span><span class="nav-label">Compliance Gate</span></button>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></span><span class="nav-label">Publishing Queue</span></button>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg></span><span class="nav-label">Performance</span></button>

      <div class="nav-group-label">Settings</div>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16.5A3.5 3.5 0 0 0 10.5 20H14a3.5 3.5 0 0 0 3.5-3.5V14h-11v2.5Z"/><path d="M17.5 14V10A3.5 3.5 0 0 0 14 6.5h-3.5A3.5 3.5 0 0 0 7 10v4"/><path d="M10 6.5V4"/><path d="M14 6.5V4"/></svg></span><span class="nav-label">Integrations</span></button>
      <button class="nav-item"><span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span class="nav-label">Brand Settings</span></button>
    </nav>
    <div class="sidebar-footer">
      <span class="status-dot"></span>
      <span class="footer-label">Brain</span>
      <span class="footer-value">v12 · synced</span>
    </div>
  </aside>
  <div class="deco">
    <div class="ann"><b>Three nav groups:</b> Brain (intelligence creation) · Pipeline (the 8-stage flow) · Settings. Footer surfaces <b>Brain version</b> with a sync-pulse dot — replaces the topbar cache indicator on mobile.</div>
  </div>
</div></body></html>
